<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Who's That Pokémon? | Raffle Draw</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0d4ba8">
  <meta name="build" content="20261017140627">
  <script>
    // If this page came from a stale cache, jump to the latest build.
    (function () {
      try {
        var build = document.querySelector('meta[name="build"]').content;
        fetch("../version.txt?t=" + Date.now(), { cache: "no-store" })
          .then(function (r) { return r.ok ? r.text() : ""; })
          .then(function (latest) {
            latest = latest.trim();
            if (!/^\d+$/.test(latest) || latest === build) return;
            if (new URLSearchParams(location.search).get("v") === latest) return; // avoid loops
            location.replace(location.pathname + "?" + "v=" + latest + location.hash);
          })
          .catch(function () {});
      } catch (e) {}
    })();
  </script>
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="../assets/favicon-180.png">
  <link rel="preload" href="../assets/fonts/anton-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../assets/fonts/luckiest-guy-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../assets/pokemon/wtp-speed.webp" as="image">
  <link rel="preload" href="../assets/pokemon/wtp-burst.webp" as="image">
  <link rel="stylesheet" href="raffle.css?v=20261017140627">
</head>
<body class="draw">
  <main class="stage" id="stage" data-phase="idle">
    <!-- Everything sits in a 4:3 frame, like the 1998 broadcast; the background bleeds past it to fill wide screens. -->
    <div class="frame" id="frame">
      <div class="speed" aria-hidden="true"></div>
      <div class="whiteout" aria-hidden="true"></div>
      <div class="burst" aria-hidden="true"></div>

      <!-- Between draws -->
      <section class="idle" id="idle" aria-labelledby="idleTitle">
        <span class="pokeball idle-ball" aria-hidden="true"></span>
        <h1 class="idle-title" id="idleTitle">
          <span class="wt name-style">Who's That</span>
          <span class="pk"><img src="../assets/pokemon/pokemon-logo.svg" alt="Pokémon"><img class="q-inline" src="../assets/pokemon/wtp-question.svg" alt="?"></span>
        </h1>
        <p class="idle-sub name-style">Baby Shower Raffle</p>
        <p class="idle-pool" id="poolText"></p>
        <ol class="past" id="past" aria-label="Winners so far"></ol>
      </section>

      <!-- The show -->
      <figure class="mon" aria-hidden="true">
        <span class="sil sil-shadow" id="silShadow"></span>
        <span class="sil" id="sil"></span>
        <img id="monImg" alt="">
      </figure>
      <div class="ball-in" aria-hidden="true"><span class="pokeball" id="ball"></span></div>
      <img class="qmark" src="../assets/pokemon/wtp-question.svg" alt="">
      <h2 class="mon-name name-style" id="monName"></h2>
      <img class="show-logo" src="../assets/pokemon/pokemon-logo.svg" alt="">
      <p class="winner" id="winner" aria-live="polite"></p>
      <p class="test-badge" id="testBadge">Test run · not recorded</p>
    </div>

    <div class="dip" id="dip" aria-hidden="true"></div>

    <nav class="controls" id="controls" aria-label="Draw controls">
      <button type="button" class="cbtn cbtn-main" data-show="idle" data-act="draw">Draw! <kbd>Space</kbd></button>
      <button type="button" class="cbtn" data-show="idle" data-act="test">Test run <kbd>T</kbd></button>
      <button type="button" class="cbtn cbtn-main" data-show="ask" data-act="reveal">Reveal! <kbd>Space</kbd></button>
      <button type="button" class="cbtn cbtn-main" data-show="reveal" data-act="done">Done <kbd>Space</kbd></button>
      <button type="button" class="cbtn" data-show="reveal" data-act="noshow" id="noshowBtn">Not here? Redraw <kbd>R</kbd></button>
    </nav>

    <div class="hud" id="hud">
      <a class="hbtn" href="index.html" title="Raffle Pokédex">Pokédex</a>
      <button type="button" class="hbtn" id="settingsBtn" title="Sound settings">🔊 Sound</button>
      <button type="button" class="hbtn" id="fsBtn" title="Full screen (F)">⛶ Full screen</button>
    </div>
  </main>

  <dialog class="sheet" id="settings" aria-labelledby="settingsTitle">
    <form method="dialog">
      <h2 id="settingsTitle">Sound</h2>
      <p class="note" id="clipNote"></p>
      <label class="check"><input type="checkbox" id="voiceOn"> Computer voice says “It's …!” over the reveal music</label>
      <label for="voiceSelect">Computer voice</label>
      <div class="row">
        <select id="voiceSelect"></select>
        <button type="button" class="btn" id="voiceTest">▶ Test</button>
      </div>
      <p class="note">Pick the voice that sounds most excited; the TV's speakers and volume matter more than you'd think. Do a test run before guests arrive.</p>
      <div class="row end"><button class="btn btn-light" value="close">Close</button></div>
    </form>
  </dialog>

  <script src="pokedex.js?v=20261017140627"></script>
  <script src="raffle-config.js?v=20261017140627"></script>
  <script src="common.js?v=20261017140627"></script>
  <script src="draw.js?v=20261017140627"></script>
</body>
</html>
